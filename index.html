<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Me</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f5f7;
            color: #2d3436;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }

        .card {
            background-color: #ffffff;
            width: 100%;
            max-width: 380px;
            padding: 48px 32px 40px;
            border-radius: 16px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }

        .photo {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ffffff;
            outline: 2px solid #2f6fed;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .role {
            font-size: 15px;
            color: #74808a;
            margin-bottom: 28px;
        }

        .divider {
            width: 40px;
            height: 3px;
            background-color: #2f6fed;
            border-radius: 2px;
            margin: 0 auto 28px;
        }

        .email {
            display: inline-block;
            padding: 10px 22px;
            border: 1px solid #2f6fed;
            border-radius: 999px;
            color: #2f6fed;
            text-decoration: none;
            font-size: 15px;
            transition: background-color 0.2s, color 0.2s;
        }

        .email:hover {
            background-color: #2f6fed;
            color: #ffffff;
        }
    </style>
</head>

<body>
    <div class="card">
        <img class="photo" src="me.png" alt="Photo of Abdullah Zayed">
        <h1>Abdullah Zayed</h1>
        <p class="role">Python &amp; Django Learner</p>
        <div class="divider"></div>
        <a class="email" href="mailto:contact@zayedabdullah.com">contact@zayedabdullah.com</a>
    </div>
</body>

</html>
